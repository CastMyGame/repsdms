# Test-only configuration. This file is first on the test classpath, so unit
# tests never load real Secret Manager values or connect to a live database.
server.port=0
spring.main.banner-mode=off
spring.cloud.gcp.secretmanager.enabled=false
spring.cloud.gcp.parametermanager.enabled=false
spring.cloud.gcp.project-id=reps-test
spring.data.mongodb.uri=mongodb://localhost:27017/reps-test?serverSelectionTimeoutMS=100
spring.data.mongodb.auto-index-creation=false

# Deliberately non-production values used only by tests.
# No static JWT fixture: JwtUtils generates its signing key cryptographically.
security.jwt.access-token-minutes=15
security.jwt.refresh-token-days=30
stripe.secret.key=sk_test_reps_automation_only
stripe.webhook.secret=whsec_reps_automation_only
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.invalid
spring.mail.password=not-a-real-password

# Tests cover application routes without starting the external Google SSO flow.
auth.sso.google.enabled=false
auth.sso.only=false
auth.sso.google.redirect-url=http://localhost:3000/login
