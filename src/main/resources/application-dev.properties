spring.data.mongodb.uri=${sm@reps-dev-mongodb-uri}
stripe.secret.key=${sm@stripe_key}
stripe.webhook.secret=${sm@stripe_webhook_key}
stripe.checkout.success-url=https://repsdev.vercel.app/checkout/success
stripe.checkout.cancel-url=https://repsdev.vercel.app/checkout/cancel
spring.mail.password=${sm@gmail_password}
spring.security.oauth2.client.registration.google.client-id=${sm@google_oauth_client_id}
spring.security.oauth2.client.registration.google.client-secret=${sm@google_oauth_client_secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
# Dev supports both password login and Google OAuth.
auth.sso.only=false
auth.sso.google.redirect-url=https://repsdev.vercel.app

# Server-generated account setup destinations.
reps.accounts.public-base-url=${REPS_ACCOUNTS_PUBLIC_BASE_URL:https://repsdev.vercel.app}

# All dev instances must resolve the same dedicated signing secret.
reps.auth.jwt.signing-key=${REPS_JWT_SIGNING_KEY:${sm@reps-dev-jwt-signing-key/${reps.auth.jwt.signing-key-version:1}}}
