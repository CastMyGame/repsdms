# Explicit manual-email testing only. Use scripts/start-email-local.ps1 to replace
# the normal configuration location; do not combine with dev/prod profiles.
server.address=127.0.0.1
server.port=8080
spring.config.import=
spring.cloud.gcp.core.enabled=false
spring.cloud.gcp.secretmanager.enabled=false
spring.cloud.gcp.parametermanager.enabled=false
spring.cloud.vault.enabled=false
spring.data.mongodb.uri=${REPS_LOCAL_MONGODB_URI}
spring.data.mongodb.auto-index-creation=false
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${REPS_LOCAL_SMTP_USERNAME}
spring.mail.password=${REPS_LOCAL_SMTP_PASSWORD}
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
spring.security.oauth2.client.registration.google.client-id=${REPS_LOCAL_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${REPS_LOCAL_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
auth.sso.google.enabled=true
auth.sso.only=false
auth.sso.google.redirect-url=http://localhost:3000/login
mail.service.provider=hybrid
mail.service.user-emails.enabled=true
mail.service.system-emails.provider=smtp
reps.email.routing.phase1-enabled=true
reps.email.gmail.connection-enabled=true
reps.email.gmail.encryption-key=${REPS_LOCAL_GMAIL_ENCRYPTION_KEY}
reps.email.gmail.redirect-uri=http://localhost:3000/account/gmail/callback
reps.email.notifications.enabled=true
reps.email.notifications.dispatch-enabled=true
reps.email.notifications.poll-ms=30000
# Satisfy existing billing initialization without giving it usable credentials.
# Billing and non-English translation are outside this manual email procedure.
stripe.secret.key=sk_test_local_email_disabled
stripe.webhook.secret=whsec_local_email_disabled
