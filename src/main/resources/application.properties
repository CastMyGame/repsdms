# Email Service Configuration
# Feature flags to control email routing behavior
# 
# mail.service.provider: Overall email service mode
#   - "smtp": All emails use SMTP (REPS.DMS@gmail.com) - default
#   - "hybrid": Smart routing - user emails via Gmail API, system emails via SMTP
#
# mail.service.user-emails.enabled: Enable Gmail API for user-initiated emails
#   - true: User-specific emails (class announcements, etc.) use Gmail API if user has OAuth token
#   - false: All emails use SMTP
#
# mail.service.system-emails.provider: Provider for system/scheduled emails
#   - "smtp": System emails always use SMTP (recommended)
#   - "gmail-api": System emails try Gmail API (not recommended - needs user context)
mail.service.provider=hybrid
mail.service.user-emails.enabled=true
mail.service.system-emails.provider=smtp

# Gmail SMTP Configuration (used when mail.service.provider=smtp)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
